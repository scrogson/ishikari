name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (Postgres ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Postgres the README supports, and the newest.
        postgres: [12, 18]

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ishikari_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ishikari-wasm

      # Runs the doc tests too.
      - name: Run tests
        run: cargo test --workspace --locked
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ishikari_test

      # A workspace of its own: wasmtime needs a newer Rust than the MSRV.
      - name: Run ishikari-wasm's tests
        run: cargo test --manifest-path ishikari-wasm/Cargo.toml --locked
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ishikari_test

  # Branch protection requires a check named `Test`, which the matrix's jobs are not. This one
  # passes only when every Postgres version's run did; `always()` so it fails, not skips, when
  # one didn't (a skipped check counts as passed).
  test-gate:
    name: Test
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every Postgres version passed
        run: test "${{ needs.test.result }}" = success

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            ishikari-wasm

      - name: Check formatting
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path ishikari-wasm/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Clippy ishikari-admin without default features
        run: cargo clippy -p ishikari-admin --all-targets --no-default-features --locked -- -D warnings

      - name: Clippy ishikari-wasm
        run: cargo clippy --manifest-path ishikari-wasm/Cargo.toml --all-targets --locked -- -D warnings

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2

      # The libraries and binaries; the dev-dependencies (trybuild, handlebars) need a newer Rust.
      # ishikari-wasm, a workspace of its own, has wasmtime's rust-version.
      - name: Check
        run: cargo check --workspace --all-features --locked

  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Scans the lockfiles; ignores are in .cargo/audit.toml.
      - name: Run security audit
        run: |
          cargo audit
          cargo audit --file ishikari-wasm/Cargo.lock
