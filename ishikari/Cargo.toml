[package]
name = "ishikari"
version = "0.1.1"
edition = "2021"
description = "Atomic, transaction-safe job queueing for Rust applications. Backed by PostgreSQL. Features include reliable background job execution, queue management, retry mechanisms, and flexible backoff strategies."
license = "MIT"
repository = "https://github.com/scrogson/ishikari"
authors = ["Sonny Scroggin <sonny@scrogg.in>"]

[dependencies]
anyhow = "1.0.75"
async-trait = "0.1.74"
chrono = { version = "0.4.31", features = ["serde"] }
figment = { version = "0.10.12", features = ["env", "yaml"] }
futures = "0.3.29"
ishikari-macros = { version = "0.1.1", path = "../ishikari-macros" }
rand = "0.8.5"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
sqlx = { version = "0.8", features = [
    "migrate",
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "json",
] }
tokio = { version = "1.34.0", features = ["full"] }
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
typetag = "0.2.13"
