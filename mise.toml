[tools]
rust = "latest"

[env]
_.file = ".env"

[tasks.build]
description = "Build the project"
run = "cargo build"

[tasks.build-release]
description = "Build in release mode"
run = "cargo build --release"

[tasks.test]
description = "Run all tests"
run = "cargo test"

[tasks.test-watch]
description = "Run tests in watch mode"
run = "cargo watch -x test"

[tasks.check]
description = "Run cargo check"
run = "cargo check"

[tasks.clippy]
description = "Run clippy with warnings as errors"
run = "cargo clippy -- -D warnings"

[tasks.fmt]
description = "Format code"
run = "cargo fmt"

[tasks.fmt-check]
description = "Check code formatting"
run = "cargo fmt -- --check"

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.dev]
description = "Development workflow: format, lint, test"
depends = ["fmt", "clippy", "test"]

[tasks.admin]
description = "Run the admin dashboard"
run = "cargo run -p ishikari-admin"

[tasks.version-patch]
description = "Bump patch version and sync dependencies"
run = "scripts/version-bump.sh patch"

[tasks.version-minor]
description = "Bump minor version and sync dependencies"
run = "scripts/version-bump.sh minor"

[tasks.version-major]
description = "Bump major version and sync dependencies"
run = "scripts/version-bump.sh major"

[tasks.publish-dry-run]
description = "Test publish process without publishing"
run = """
#!/usr/bin/env bash
echo "Dry running publish for ishikari-macros..."
cd ishikari-macros && cargo publish --dry-run --allow-dirty && cd ..
echo "Dry running publish for ishikari..."
cd ishikari && cargo publish --dry-run --allow-dirty
"""

[tasks.publish]
description = "Publish crates to crates.io"
run = """
#!/usr/bin/env bash
echo "Publishing ishikari-macros..."
cd ishikari-macros && cargo publish && cd ..
echo "Publishing ishikari..."
cd ishikari && cargo publish
"""

[tasks.release]
description = "Full release workflow"
depends = ["fmt", "clippy", "test", "build-release", "publish-dry-run"]
