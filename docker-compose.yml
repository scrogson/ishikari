volumes:
  postgres:
    external: true

services:
  postgres:
    image: postgres:latest
    restart: "always"
    command: postgres -N 500
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres:/var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
