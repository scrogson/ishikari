<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ishikari Pro Admin{% endblock %}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --border: #334155;
            --pro: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .layout { display: flex; min-height: 100vh; }

        .sidebar {
            width: 240px;
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border);
            padding: 1rem;
            position: fixed;
            height: 100vh;
        }

        .sidebar-logo {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-logo .pro-badge {
            background: linear-gradient(135deg, var(--pro), var(--accent));
            color: white;
            font-size: 0.625rem;
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-weight: 600;
        }

        .sidebar-nav { list-style: none; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            color: var(--text-secondary);
            text-decoration: none;
            border-radius: 0.375rem;
            margin-bottom: 0.25rem;
            transition: all 0.2s;
        }
        .sidebar-nav a:hover { background-color: var(--bg-tertiary); color: var(--text-primary); }
        .sidebar-nav a.active { background-color: var(--accent); color: white; }
        .sidebar-nav .nav-icon { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }
        .sidebar-nav .section-label {
            font-size: 0.625rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            padding: 1rem 1rem 0.5rem;
            margin-top: 0.5rem;
        }

        .main-content { flex: 1; margin-left: 240px; padding: 2rem; }

        .page-header { margin-bottom: 2rem; }
        .page-title { font-size: 1.875rem; font-weight: 700; margin-bottom: 0.5rem; }
        .page-subtitle { color: var(--text-secondary); }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .card-title { font-size: 1.125rem; font-weight: 600; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1rem; }
        .stat-card { background-color: var(--bg-tertiary); border-radius: 0.375rem; padding: 1rem; text-align: center; }
        .stat-value { font-size: 1.75rem; font-weight: 700; }
        .stat-label { font-size: 0.75rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
        .stat-available { color: var(--success); }
        .stat-executing { color: var(--accent); }
        .stat-scheduled { color: var(--warning); }
        .stat-retryable { color: #f97316; }
        .stat-completed { color: var(--text-secondary); }
        .stat-discarded { color: var(--danger); }
        .stat-cancelled { color: var(--text-muted); }

        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: var(--text-secondary); font-size: 0.875rem; text-transform: uppercase; }
        tr:hover { background-color: var(--bg-tertiary); }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
        }
        .badge-info { background-color: rgba(59, 130, 246, 0.2); color: var(--accent); }
        .badge-success { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge-warning { background-color: rgba(234, 179, 8, 0.2); color: var(--warning); }
        .badge-error { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); }
        .badge-neutral { background-color: rgba(100, 116, 139, 0.2); color: var(--text-muted); }
        .badge-primary { background-color: rgba(34, 197, 94, 0.2); color: var(--success); }
        .badge-secondary { background-color: rgba(234, 179, 8, 0.2); color: var(--warning); }
        .badge-ghost { background-color: var(--bg-tertiary); color: var(--text-secondary); }

        .btn {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-primary { background-color: var(--accent); color: white; }
        .btn-secondary { background-color: var(--bg-tertiary); color: var(--text-primary); }

        .filters { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .filter-group { min-width: 150px; }
        .form-label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); }
        .form-input, .form-select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            background-color: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            color: var(--text-primary);
        }

        .pagination { display: flex; justify-content: center; gap: 0.5rem; margin-top: 1rem; }
        .pagination a, .pagination span { padding: 0.5rem 0.75rem; border-radius: 0.375rem; color: var(--text-secondary); text-decoration: none; }
        .pagination a:hover { background-color: var(--bg-tertiary); }
        .pagination .active { background-color: var(--accent); color: white; }

        .progress-bar {
            height: 0.5rem;
            background-color: var(--bg-tertiary);
            border-radius: 0.25rem;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--accent));
            transition: width 0.3s;
        }

        .code-block {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            padding: 1rem;
            overflow-x: auto;
            font-family: 'Monaco', monospace;
            font-size: 0.875rem;
        }

        .detail-grid { display: grid; grid-template-columns: 150px 1fr; gap: 0.75rem; }
        .detail-label { font-weight: 500; color: var(--text-secondary); }

        .workflow-graph { margin-top: 1.5rem; }
        .job-node {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: var(--bg-tertiary);
            border-radius: 0.375rem;
            margin: 0.25rem;
        }

        .empty-state { text-align: center; padding: 3rem; color: var(--text-muted); }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

</html>
