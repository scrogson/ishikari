<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ishikari Admin{% endblock %}</title>
    <script>
        // Apply saved theme before first paint to avoid a flash
        try {
            const t = localStorage.getItem("ishikari-theme");
            if (t) document.documentElement.dataset.theme = t;
        } catch (_) {}
    </script>
    <link rel="stylesheet" href="{{ base_path }}/assets/admin.css">
    <script src="{{ base_path }}/assets/htmx.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-200 text-base-content antialiased">
    <div class="drawer lg:drawer-open">
        <input id="nav-drawer" type="checkbox" class="drawer-toggle">

        <div class="drawer-content flex min-h-screen flex-col">
            <!-- Top bar -->
            <header class="navbar sticky top-0 z-20 gap-2 border-b border-base-300 bg-base-100/80 px-4 backdrop-blur">
                <label for="nav-drawer" class="btn btn-square btn-ghost btn-sm lg:hidden" aria-label="Open menu">
                    <svg class="size-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </label>
                <div class="lg:hidden">
                    <a href="{% if base_path.is_empty() %}/{% else %}{{ base_path }}{% endif %}" class="flex items-center gap-2 font-bold">
                    <svg class="size-5 text-primary" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Ishikari
                </a>
                </div>
                <div class="flex-1"></div>
                <label class="swap swap-rotate btn btn-ghost btn-circle btn-sm" title="Toggle theme">
                    <input type="checkbox" id="theme-toggle" aria-label="Toggle light theme">
                    <!-- moon: shown in dark mode -->
                    <svg class="swap-off size-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
                    <!-- sun: shown in light mode -->
                    <svg class="swap-on size-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"/></svg>
                </label>
            </header>

            <main class="{% block main_class %}mx-auto w-full max-w-7xl flex-1 space-y-6 p-4 lg:p-8{% endblock %}">
                {% block content %}{% endblock %}
            </main>
        </div>

        <!-- Sidebar -->
        <div class="drawer-side z-30">
            <label for="nav-drawer" class="drawer-overlay" aria-label="Close menu"></label>
            <aside class="flex min-h-full w-64 flex-col border-r border-base-300 bg-base-100">
                <a href="{% if base_path.is_empty() %}/{% else %}{{ base_path }}{% endif %}" class="flex items-center gap-2 px-6 py-5 text-lg font-bold">
                    <svg class="size-6 text-primary" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                    Ishikari
                </a>
                <ul class="menu w-full gap-1 px-3" id="sidebar-nav">
                    {% for item in nav_items %}
                    <li>
                        <a href="{{ item.href }}">
                            {% if let Some(icon) = item.icon %}
                            <svg class="size-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="{{ icon }}"/>
                            </svg>
                            {% endif %}
                            {{ item.label }}
                        </a>
                    </li>
                    {% endfor %}
                </ul>
            </aside>
        </div>
    </div>

    <script>
        // Highlight the nav item matching the current page (longest prefix wins)
        (function () {
            const path = location.pathname.replace(/\/$/, "");
            let best = null, bestLen = -1;
            document.querySelectorAll("#sidebar-nav a").forEach(function (a) {
                const href = new URL(a.href).pathname.replace(/\/$/, "");
                const match = path === href || path.startsWith(href + "/");
                if (match && href.length > bestLen) { best = a; bestLen = href.length; }
            });
            if (best) best.classList.add("menu-active");
        })();

        // Tooltip for [data-tip] elements (e.g. full worker paths). Fixed-position
        // so it isn't clipped by scrolling table containers.
        (function () {
            const tip = document.createElement("div");
            tip.className = "pointer-events-none fixed z-50 hidden max-w-lg rounded-field bg-neutral px-2 py-1 font-mono text-xs text-neutral-content shadow-lg break-all";
            tip.setAttribute("role", "tooltip");
            document.body.appendChild(tip);
            function hide() { tip.classList.add("hidden"); }
            document.addEventListener("mouseover", function (e) {
                const el = e.target.closest("[data-tip]");
                if (!el) return hide();
                tip.textContent = el.dataset.tip;
                tip.classList.remove("hidden");
                const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect();
                const left = Math.min(Math.max(8, r.left), window.innerWidth - t.width - 8);
                const top = r.top - t.height - 6 < 8 ? r.bottom + 6 : r.top - t.height - 6;
                tip.style.left = left + "px";
                tip.style.top = top + "px";
            });
            window.addEventListener("scroll", hide, true);
        })();

        // Theme toggle (dark is the default)
        (function () {
            const toggle = document.getElementById("theme-toggle");
            toggle.checked = document.documentElement.dataset.theme === "light";
            toggle.addEventListener("change", function () {
                const theme = toggle.checked ? "light" : "dark";
                document.documentElement.dataset.theme = theme;
                try { localStorage.setItem("ishikari-theme", theme); } catch (_) {}
            });
        })();
    </script>
</body>
</html>
