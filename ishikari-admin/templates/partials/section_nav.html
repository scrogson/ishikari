<nav class="ishikari-admin mb-6" aria-label="Job dashboard">
    <ul class="ik-tabs">
        {% for item in page.nav %}
        <li class="flex">
            <a href="{{ item.href }}" class="ik-tab"{% if self.is_active(loop.index0) %} aria-current="page"{% endif %}>
                {% if let Some(icon) = item.icon %}
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.6" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="{{ icon }}"/>
                </svg>
                {% endif %}
                {{ item.label }}
            </a>
        </li>
        {% endfor %}
    </ul>
</nav>
