{% extends "base.html" %}

{% block title %}Sagas - Ishikari Admin{% endblock %}

{% block content %}
<div>
    <h1 class="text-2xl font-bold tracking-tight">Sagas</h1>
    <p class="text-sm text-base-content/60">Distributed transactions with compensation</p>
</div>

<section class="card border border-base-300 bg-base-100 shadow-sm">
    <div class="card-body gap-4">
        <div class="flex flex-wrap items-end justify-between gap-4">
            <h2 class="card-title text-base">All Sagas ({{ total }})</h2>
            <form id="sagas-filter-form" class="w-48" hx-get="{{ base_path }}/api/sagas" hx-target="#sagas-table" hx-trigger="change">
                <fieldset class="fieldset py-0">
                    <legend class="fieldset-legend">State</legend>
                    <select name="state" class="select select-sm w-full">
                        <option value="">All States</option>
                        <option value="running" {% if current_state.as_deref() == Some("running") %}selected{% endif %}>Running</option>
                        <option value="completed" {% if current_state.as_deref() == Some("completed") %}selected{% endif %}>Completed</option>
                        <option value="failed" {% if current_state.as_deref() == Some("failed") %}selected{% endif %}>Failed</option>
                        <option value="compensating" {% if current_state.as_deref() == Some("compensating") %}selected{% endif %}>Compensating</option>
                        <option value="compensated" {% if current_state.as_deref() == Some("compensated") %}selected{% endif %}>Compensated</option>
                        <option value="cancelled" {% if current_state.as_deref() == Some("cancelled") %}selected{% endif %}>Cancelled</option>
                    </select>
                </fieldset>
            </form>
        </div>

        <div id="sagas-table">
            {% include "partials/sagas_table.html" %}
        </div>
    </div>
</section>
{% endblock %}
