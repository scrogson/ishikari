{% extends "base.html" %}

{% block title %}Sagas{% endblock %}

{% block content %}
<header class="ik-page-header">
    <div>
        <h1 class="ik-title">Sagas</h1>
        <p class="ik-subtitle">Distributed transactions with compensation</p>
    </div>
</header>

<section class="ik-card">
    <div class="ik-card-header">
        <div>
            <h2 class="ik-card-title">All sagas</h2>
            <p class="ik-card-desc"><span class="tabular-nums">{{ total }}</span> in total</p>
        </div>
        <form id="sagas-filter-form" hx-get="{{ base_path }}/api/sagas" hx-target="#sagas-table" hx-trigger="change">
            <label class="flex items-center gap-2">
                <span class="ik-label">State</span>
                <select name="state" class="ik-select ik-input-sm w-44">
                    <option value="">All States</option>
                    <option value="running" {% if current_state.as_deref() == Some("running") %}selected{% endif %}>Running</option>
                    <option value="completed" {% if current_state.as_deref() == Some("completed") %}selected{% endif %}>Completed</option>
                    <option value="failed" {% if current_state.as_deref() == Some("failed") %}selected{% endif %}>Failed</option>
                    <option value="compensating" {% if current_state.as_deref() == Some("compensating") %}selected{% endif %}>Compensating</option>
                    <option value="compensated" {% if current_state.as_deref() == Some("compensated") %}selected{% endif %}>Compensated</option>
                    <option value="cancelled" {% if current_state.as_deref() == Some("cancelled") %}selected{% endif %}>Cancelled</option>
                </select>
            </label>
        </form>
    </div>
    <div id="sagas-table">
        {% include "partials/sagas_table.html" %}
    </div>
</section>
{% endblock %}
