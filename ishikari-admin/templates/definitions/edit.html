{% extends "base.html" %}

{% block title %}{% if is_new %}New Definition{% else %}Edit {{ name }}{% endif %}{% endblock %}

{% block main_class %}flex flex-1 flex-col{% endblock %}

{% block content %}
<div id="workflow-builder-root" class="flex h-[calc(100vh-3.5rem)] flex-col">
    <div class="flex h-full items-center justify-center gap-3 text-sm ik-muted">
        <span class="ik-spinner"></span>
        Loading workflow builder…
    </div>
</div>

<!-- Pass data to React -->
<script>
    window.__WORKFLOW_BUILDER__ = {
        definitionId: {% match definition_id %}{% when Some with (id) %}{{ id }}{% when None %}null{% endmatch %},
        isNew: {{ is_new }},
        basePath: '{{ base_path }}',
        apiBase: '{{ base_path }}/api'
    };
</script>

<!-- Load React app from embedded assets -->
<link rel="stylesheet" href="{{ base_path }}/builder/assets/index.css">
<script type="module" src="{{ base_path }}/builder/assets/index.js"></script>
{% endblock %}
