{% extends "base.html" %}

{% block title %}Jobs{% endblock %}

{% block content %}
<header class="ik-page-header">
    <div>
        <h1 class="ik-title">Jobs</h1>
        <p class="ik-subtitle"><span class="tabular-nums">{{ total }}</span> jobs</p>
    </div>
</header>

<section class="ik-card">
    <form id="jobs-filter-form" class="grid grid-cols-2 gap-3 border-b border-ik-border p-4 md:grid-cols-3 xl:grid-cols-6">
        <label class="ik-field">
            <span class="ik-label">State</span>
            <select name="state" class="ik-select ik-input-sm" hx-get="{{ base_path }}/api/jobs" hx-target="#jobs-table" hx-trigger="change" hx-include="#jobs-filter-form">
                <option value="">All States</option>
                <option value="pending" {% if current_state.as_deref() == Some("pending") %}selected{% endif %}>Pending (waiting on dependencies)</option>
                <option value="available" {% if current_state.as_deref() == Some("available") %}selected{% endif %}>Available</option>
                <option value="scheduled" {% if current_state.as_deref() == Some("scheduled") %}selected{% endif %}>Scheduled</option>
                <option value="executing" {% if current_state.as_deref() == Some("executing") %}selected{% endif %}>Executing</option>
                <option value="completed" {% if current_state.as_deref() == Some("completed") %}selected{% endif %}>Completed</option>
                <option value="retryable" {% if current_state.as_deref() == Some("retryable") %}selected{% endif %}>Retryable</option>
                <option value="discarded" {% if current_state.as_deref() == Some("discarded") %}selected{% endif %}>Discarded</option>
                <option value="cancelled" {% if current_state.as_deref() == Some("cancelled") %}selected{% endif %}>Cancelled</option>
                <option value="compensated" {% if current_state.as_deref() == Some("compensated") %}selected{% endif %}>Compensated (saga)</option>
            </select>
        </label>

        <label class="ik-field">
            <span class="ik-label">Queue</span>
            <select name="queue" class="ik-select ik-input-sm" hx-get="{{ base_path }}/api/jobs" hx-target="#jobs-table" hx-trigger="change" hx-include="#jobs-filter-form">
                <option value="">All Queues</option>
                {% for q in queues %}
                <option value="{{ q }}" {% if current_queue.as_deref() == Some(q.as_str()) %}selected{% endif %}>{{ q }}</option>
                {% endfor %}
            </select>
        </label>

        <label class="ik-field">
            <span class="ik-label">Worker</span>
            <select name="worker" class="ik-select ik-input-sm" hx-get="{{ base_path }}/api/jobs" hx-target="#jobs-table" hx-trigger="change" hx-include="#jobs-filter-form">
                <option value="">All Workers</option>
                {% for w in workers %}
                <option value="{{ w }}" title="{{ w }}" {% if current_worker.as_deref() == Some(w.as_str()) %}selected{% endif %}>{{ w|short_name }}</option>
                {% endfor %}
            </select>
        </label>

        <label class="ik-field">
            <span class="ik-label">Has Dependencies</span>
            <select name="has_deps" class="ik-select ik-input-sm" hx-get="{{ base_path }}/api/jobs" hx-target="#jobs-table" hx-trigger="change" hx-include="#jobs-filter-form">
                <option value="">Any</option>
                <option value="true" {% if has_deps_filter == Some(true) %}selected{% endif %}>Yes</option>
            </select>
        </label>

        <label class="ik-field">
            <span class="ik-label">Is Blocking</span>
            <select name="is_blocking" class="ik-select ik-input-sm" hx-get="{{ base_path }}/api/jobs" hx-target="#jobs-table" hx-trigger="change" hx-include="#jobs-filter-form">
                <option value="">Any</option>
                <option value="true" {% if is_blocking_filter == Some(true) %}selected{% endif %}>Yes</option>
            </select>
        </label>

        <label class="ik-field">
            <span class="ik-label">In Workflow</span>
            <select name="in_workflow" class="ik-select ik-input-sm" hx-get="{{ base_path }}/api/jobs" hx-target="#jobs-table" hx-trigger="change" hx-include="#jobs-filter-form">
                <option value="">Any</option>
                <option value="true" {% if in_workflow_filter == Some(true) %}selected{% endif %}>Yes</option>
            </select>
        </label>
    </form>
    <div id="jobs-table">
        {% include "partials/enhanced_jobs_table.html" %}
    </div>
</section>
{% endblock %}
