[package]
name = "ishikari-admin"
version = "0.1.0"
edition = "2021"
description = "Admin dashboard for ishikari job queue"
license = "MIT"
repository = "https://github.com/scrogson/ishikari"

[dependencies]
# Core ishikari
ishikari = { path = "../ishikari" }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono"] }

# Templating
askama = "0.14"
askama_web = { version = "0.14", features = ["axum-0.8"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Utilities
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
