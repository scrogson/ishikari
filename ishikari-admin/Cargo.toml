[package]
name = "ishikari-admin"
version = "0.4.0"
edition = "2021"
rust-version.workspace = true
description = "Admin dashboard for ishikari job queue"
license = "MIT"
repository = "https://github.com/scrogson/ishikari"

[features]
# Does nothing: the workflow builder is plain JS (assets/builder.js) and always included. Kept
# so hosts that name it still build.
embed-frontend = []

[dependencies]
# Core ishikari
ishikari = { version = "0.4.0", path = "../ishikari" }

# Web framework
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "uuid"] }

# Templating
askama = { version = "0.14", features = ["blocks"] }
askama_web = { version = "0.14", features = ["axum-0.8"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"

# Time
chrono = { version = "0.4", features = ["serde"] }

# IDs
uuid = { version = "1", features = ["v4", "serde"] }

# Utilities
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
